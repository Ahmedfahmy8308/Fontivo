name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            run-tests: true
          - os: ubuntu-24.04
            run-tests: false
          - os: macos-latest
            run-tests: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Build Frontend UI for include_dir!
        working-directory: src/ui
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Cache Cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-
            cargo-v1-${{ runner.os }}-

      - name: Verify code formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -A clippy::all

      - name: Cargo test (Windows native engine & routes)
        if: matrix.run-tests == true
        run: cargo test -- --nocapture --test-threads=4

  ui-check:
    name: React UI (Vitest, TypeCheck, Build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci || npm install

      - name: Vitest test suite
        working-directory: src/ui
        run: npm test

      - name: TypeScript strict verification
        working-directory: src/ui
        run: npx tsc --noEmit

      - name: Build Vite bundle
        working-directory: src/ui
        run: npm run build

  installer-smoke:
    name: Installer Scripts & Syntax Smoke Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate bash script syntax
        run: |
          set -e
          find scripts -name "*.sh" -print0 | while IFS= read -r -d '' file; do
            echo "Verifying syntax: $file"
            bash -n "$file"
          done

      - name: Validate PowerShell scripts syntax via pwsh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem -Path scripts -Recurse -Filter '*.ps1'
          if ($scripts.Count -eq 0) { throw 'No .ps1 scripts found to validate' }
          foreach ($file in $scripts) {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                Write-Host "::error file=$($file.FullName):: $($err.Message)"
              }
              throw "Parse syntax error in $($file.Name)"
            }
            Write-Host "[ok] Syntax valid: $($file.FullName)"
          }
          Write-Host "Successfully validated $($scripts.Count) PowerShell scripts."

      - name: Verify Windows PowerShell encoding compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($f in (Get-ChildItem -Path scripts -Recurse -Filter '*.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            # If UTF-8 BOM is present, it is valid for Windows PowerShell
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              continue
            }
            # Otherwise check for non-ASCII bytes
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -gt 127) {
                $bad += "$($f.Name) at byte offset $i"
                break
              }
            }
          }
          if ($bad.Count -gt 0) {
            Write-Host "Non-ASCII / non-BOM bytes found in installer scripts:" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host " - $_" }
            throw "BOM-less distributed scripts must remain pure ASCII."
          }
          Write-Host "[ok] All distributed scripts comply with Windows encoding rules."
